name: SAVIA golden path

# C5 API smoke and C6 Chrome path use the real API over loopback HTTPS and disposable SQL.
# C6 checks SQL after browser steps, including a committed sale whose response is lost and recovered.
# Synthetic data only; no deploy or accounts outside the throwaway databases.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      supply_receipt:
        description: 'Combined receipt journey (requires separate Jason runtime authorization)'
        type: boolean
        default: false
      stock_exception:
        description: 'Physical-stock exception and different-person review; requires supply_receipt and separate runtime authorization'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: savia-golden-path-${{ github.ref }}
  cancel-in-progress: false

jobs:
  golden-path:
    name: Real API + disposable SQL golden path
    # Licensed SQL runs only for this repository's own branches; fork PRs cannot start it.
    if: >-
      github.repository == 'Suazo-AI/Martha-Silva-Store' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Same immutable image as backend.yml and savia.yml: SQL Server 2022 Developer 16.0.4305.5, approved 2026-10-24 for non-production CI.
      SQL_IMAGE: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
      SQL_CONTAINER: savia-golden-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_SUPPLY_RECEIPT: ${{ github.event_name == 'workflow_dispatch' && inputs.supply_receipt == true }}
      RUN_STOCK_EXCEPTION: ${{ github.event_name == 'workflow_dispatch' && inputs.stock_exception == true }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Refuse invalid combined-journey inputs before runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUN_STOCK_EXCEPTION" = "true" ] && [ "$RUN_SUPPLY_RECEIPT" != "true" ]; then
            echo '::error::stock_exception requires supply_receipt and separate runtime authorization.'
            exit 1
          fi
      - name: Evidence and cleanup failure regressions (stdlib only)
        run: |
          python3 tests/test_golden_path_safety.py
          python3 tests/test_golden_path_browser_safety.py
          python3 tests/test_golden_path_stock_exception.py
          python3 tests/test_golden_path_cash.py
          python3 tests/test_golden_path_cash_evidence.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Restore pinned dependencies and build the API and the golden-path SQL tool
        run: |
          dotnet restore tests/golden-path/GoldenPath.Sql --locked-mode
          dotnet build tests/golden-path/GoldenPath.Sql --no-restore --configuration Release
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare pinned browser driver without changing the runner trust store
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c6-playwright"
          cd "$RUNNER_TEMP/c6-playwright"
          npm init -y > /dev/null
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund --ignore-scripts playwright@1.63.0
          google-chrome --version
      - name: Start disposable SQL Server 2022 Developer
        shell: bash
        run: |
          set -euo pipefail
          password="Aa1!$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          export MSSQL_SA_PASSWORD="$password"
          printf 'SQLCMDPASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          docker pull "$SQL_IMAGE"
          docker run --detach --name "$SQL_CONTAINER" --platform linux/amd64 \
            --memory 4g --cpus 2 --publish 127.0.0.1:14333:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD \
            "$SQL_IMAGE" > /dev/null
          connection="Server=127.0.0.1,14333;Database=master;User ID=sa;Password=$password;Encrypt=true;TrustServerCertificate=true;Connect Timeout=5;Pooling=false"
          echo "::add-mask::$connection"
          printf 'MARTHA_TEST_SQL_CONNECTION=%s\n' "$connection" >> "$GITHUB_ENV"
      - name: Wait for SQL and verify licensed edition and engine
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if docker exec --env SQLCMDPASSWORD "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 2 -t 3 -b \
              -Q "IF CONVERT(int, SERVERPROPERTY('ProductMajorVersion')) <> 16 THROW 51000, 'Expected SQL Server 2022', 1; IF CONVERT(nvarchar(128), SERVERPROPERTY('Edition')) NOT LIKE 'Developer%' THROW 51001, 'Expected Developer edition', 1;" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo '::error::Disposable SQL Server did not become ready within the bounded startup window.'
          exit 1
      - name: Golden path smoke (real API, migrator, roles, idempotent sale, SQL oracles, teardown)
        shell: bash
        run: |
          set -euo pipefail
          : "${MARTHA_TEST_SQL_CONNECTION:?The golden path must not silently skip}"
          # stdin is not a terminal here; the harness gives the Owner console its own private pty.
          python3 tests/golden-path/golden_path.py --no-build --out "$RUNNER_TEMP/golden-evidence" < /dev/null
      - name: C6 Chrome to real API to SQL, including lost-response recovery without a second sale
        shell: bash
        run: |
          set -euo pipefail
          : "${MARTHA_TEST_SQL_CONNECTION:?C6 must not silently skip}"
          receipt_args=()
          if [ "$RUN_SUPPLY_RECEIPT" = "true" ]; then receipt_args+=(--supply); fi
          if [ "$RUN_STOCK_EXCEPTION" = "true" ]; then receipt_args+=(--stock-exception); fi
          python3 tests/golden-path/golden_path.py --mode browser --no-build "${receipt_args[@]}" \
            --playwright-directory "$RUNNER_TEMP/c6-playwright/node_modules/playwright" \
            --out "$RUNNER_TEMP/c6-evidence" < /dev/null
      - name: Verify exact evidence bytes before publication
        id: evidence_safety
        if: ${{ always() }}
        shell: bash
        run: |
          python3 tests/golden-path/verify_evidence.py --source "$RUNNER_TEMP/golden-evidence" \
            --destination "$RUNNER_TEMP/golden-approved"
      - name: Publish the per-step oracle table to the job summary
        if: ${{ always() && steps.evidence_safety.outcome == 'success' }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/golden-approved/oracles.md" ]; then
            { echo '### SAVIA golden path: SQL oracles per step'; echo; cat "$RUNNER_TEMP/golden-approved/oracles.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized evidence only
        if: ${{ always() && steps.evidence_safety.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: savia-golden-path-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/golden-approved/evidence.json
            ${{ runner.temp }}/golden-approved/oracles.md
          if-no-files-found: error
          retention-days: 7
      - name: Verify exact C6 evidence bytes before publication
        id: browser_evidence_safety
        if: ${{ always() }}
        shell: bash
        run: |
          python3 tests/golden-path/verify_evidence.py --source "$RUNNER_TEMP/c6-evidence" \
            --destination "$RUNNER_TEMP/c6-approved"
      - name: Publish the C6 browser checkpoints and SQL oracle table
        if: ${{ always() && steps.browser_evidence_safety.outcome == 'success' }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/c6-approved/oracles.md" ]; then
            { echo '### SAVIA C6: real browser and SQL checkpoints'; echo; cat "$RUNNER_TEMP/c6-approved/oracles.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized C6 browser trace and SQL evidence only
        if: ${{ always() && steps.browser_evidence_safety.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: savia-browser-path-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c6-approved/evidence.json
            ${{ runner.temp }}/c6-approved/oracles.md
          if-no-files-found: error
          retention-days: 7
      - name: Always destroy the disposable SQL container
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect "$SQL_CONTAINER" >/dev/null 2>&1; then
            docker rm --force --volumes "$SQL_CONTAINER" > /dev/null
          fi
          rm -rf "$RUNNER_TEMP/golden-evidence"
          rm -rf "$RUNNER_TEMP/golden-approved"
          rm -rf "$RUNNER_TEMP/c6-evidence"
          rm -rf "$RUNNER_TEMP/c6-approved"
          rm -rf "$RUNNER_TEMP/c6-playwright"
          remaining="$(docker container ls --all --filter "name=^/${SQL_CONTAINER}$" --format '{{.Names}}')"
          if [ -n "$remaining" ]; then
            echo '::error::Disposable SQL container remains after teardown.'
            exit 1
          fi
          echo 'PASS: disposable SQL container absence verified.'

# This workflow does not deploy, publish, or create accounts or credentials outside the throwaway database.
