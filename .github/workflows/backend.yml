name: Backend synthetic slice

# Guards run on PRs; approved disposable SQL runs only on trusted main push/manual.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Verify SQL evidence sanitizer
        run: python3 -m unittest discover -s backend/tests -p test_verify_sql_results.py
      - name: Restore pinned dependencies
        run: dotnet restore backend/tests/Martha.Store.Api.Tests --locked-mode
      - name: Build and run database-independent guards
        run: dotnet test backend/tests/Martha.Store.Api.Tests --no-restore --configuration Release --filter 'Category!=SqlServer'

  sql-server-integration:
    needs: build-and-guards
    # Never run licensed SQL on PRs/forks or arbitrary manual refs.
    if: >-
      github.repository == 'Suazo-AI/Martha-Silva-Store' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # MCR 2022-latest resolved 2026-10-24; linux/amd64 SQL 16.0.4305.5.
      SQL_IMAGE: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
      SQL_CONTAINER: martha-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Restore pinned dependencies
        run: dotnet restore backend/tests/Martha.Store.Api.Tests --locked-mode
      - name: Start approved disposable SQL Server 2022 Developer
        shell: bash
        run: |
          set -euo pipefail
          # Explicit user approval 2026-10-24: 2022 Developer, non-production CI only.
          password="Aa1!$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          export MSSQL_SA_PASSWORD="$password"
          printf 'SQLCMDPASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          docker pull "$SQL_IMAGE"
          docker run --detach --name "$SQL_CONTAINER" --platform linux/amd64 \
            --memory 3g --cpus 2 --publish 127.0.0.1::1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD \
            "$SQL_IMAGE" > /dev/null
          port="$(docker port "$SQL_CONTAINER" 1433/tcp | sed -n 's/^127\.0\.0\.1://p')"
          [[ "$port" =~ ^[0-9]+$ ]]
          connection="Server=127.0.0.1,$port;Database=master;User ID=sa;Password=$password;Encrypt=true;TrustServerCertificate=true;Connect Timeout=5;Pooling=false"
          echo "::add-mask::$connection"
          printf 'MARTHA_TEST_SQL_CONNECTION=%s\n' "$connection" >> "$GITHUB_ENV"
      - name: Wait for SQL and verify licensed edition and engine
        shell: bash
        run: |
          set -euo pipefail
          : "${SQLCMDPASSWORD:?Missing ephemeral SQL password}"
          for attempt in $(seq 1 60); do
            if docker exec --env SQLCMDPASSWORD "$SQL_CONTAINER" \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 2 -t 3 -b \
              -Q "SET NOCOUNT ON; SELECT 1" >/dev/null 2>&1; then
              docker exec --env SQLCMDPASSWORD "$SQL_CONTAINER" \
                /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 2 -t 5 -b \
                -Q "IF CONVERT(int, SERVERPROPERTY('ProductMajorVersion')) <> 16 THROW 51000, 'Expected SQL Server 2022', 1; IF CONVERT(nvarchar(128), SERVERPROPERTY('Edition')) NOT LIKE 'Developer%' THROW 51001, 'Expected Developer edition', 1; SELECT CONVERT(nvarchar(128), SERVERPROPERTY('ProductVersion')) AS ProductVersion, CONVERT(nvarchar(128), SERVERPROPERTY('Edition')) AS Edition;"
              exit 0
            fi
            sleep 2
          done
          echo '::error::Disposable SQL Server did not become ready within the bounded startup window.'
          exit 1
      - name: Run genuine SQL tests without leaking raw diagnostic logs
        shell: bash
        run: |
          set -euo pipefail
          : "${MARTHA_TEST_SQL_CONNECTION:?SQL tests must not silently skip}"
          mkdir -p "$RUNNER_TEMP/martha-sql-results"
          # Raw TRX/stdout stay on this disposable runner; only allowlisted outcomes are uploaded.
          dotnet test backend/tests/Martha.Store.Api.Tests --no-restore --configuration Release \
            --filter 'Category=SqlServer' --logger 'trx;LogFileName=sql.trx' \
            --results-directory "$RUNNER_TEMP/martha-sql-results" \
            > "$RUNNER_TEMP/martha-sql-test.log" 2>&1
      - name: Require all six SQL tests, zero failures and zero skips; sanitize evidence
        if: ${{ always() }}
        env:
          SQL_RESULTS_DIR: ${{ runner.temp }}/martha-sql-results
        run: python3 backend/tests/verify_sql_results.py
      - name: Upload sanitized SQL outcomes only
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sql-server-synthetic-outcomes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/martha-sql-results/sanitized-results.json
          if-no-files-found: error
          retention-days: 7
      - name: Always destroy disposable SQL container and its databases
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect "$SQL_CONTAINER" >/dev/null 2>&1; then
            docker rm --force --volumes "$SQL_CONTAINER" >/dev/null
          fi
          rm -f "$RUNNER_TEMP/martha-sql-test.log" "$RUNNER_TEMP/martha-sql-results/sql.trx"
