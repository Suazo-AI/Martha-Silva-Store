# SAVIA: SQL Server 2022 for development and tests only.
# Developer edition and the 'sa' login are never a production setup.
# Image pinned by digest: SQL Server 16.0.4305.5 (2022). Change it only with a new evidence run.
name: savia-dev
services:
  sql:
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    container_name: savia-sqlserver-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in savia/infra/.env}
    ports:
      - "127.0.0.1:${SAVIA_SQL_PORT:-14340}:1433"
    volumes:
      - savia_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  savia_sql_data:
