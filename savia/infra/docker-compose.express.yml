# SAVIA: SQL Server 2022 Express, the edition a branch runs (ADR-001 D4, critique F12 and F14).
# Same pinned image as docker-compose.dev.yml; only the edition, name, port and volume differ.
# Start:  docker compose -f savia/infra/docker-compose.express.yml --env-file savia/infra/.env up -d
# Test:   SAVIA_SQL_CONTAINER=savia-sqlserver-express python savia/tools/db/saviadb.py test
name: savia-express
services:
  sql:
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    container_name: savia-sqlserver-express
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in savia/infra/.env}
    ports:
      - "127.0.0.1:${SAVIA_SQL_EXPRESS_PORT:-14341}:1433"
    volumes:
      - savia_sql_express_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  savia_sql_express_data:
