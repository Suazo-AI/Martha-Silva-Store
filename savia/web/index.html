<!doctype html>
<html lang="es">
<head>
  <link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SAVIA · Sucursal</title>
<link rel="stylesheet" href="app.css">
<script type="module" src="app.mjs"></script>
</head>
<body>
<main id="access" class="access" hidden></main>
<div class="shell" id="shell" hidden>
  <aside class="rail">
    <div class="brand">SAVIA</div>
    <nav id="nav" aria-label="Módulos">
      <a href="#/venta" data-route="venta">Venta</a>
      <a href="#/caja" data-route="caja">Caja</a>
      <a href="#/historial" data-route="historial">Historial</a>
      <a href="#/recepcion" data-route="recepcion">Recepción</a>
      <a href="#/inventario" data-route="inventario">Inventario</a>
      <a href="#/clientes" data-route="clientes">Clientes</a>
      <a href="#/reporte" data-route="reporte">Reporte del día</a>
    </nav>
  </aside>
  <div class="workspace">
    <header class="top">
      <h1 id="title" tabindex="-1"></h1>
      <div class="context">
        <span class="tag sample" id="sample-tag" hidden>MUESTRA</span>
        <span id="branch-label"></span>
        <span id="operator-label"></span>
        <a href="#/caja" class="till-state" id="till-state"></a>
        <button type="button" id="logout">Salir</button>
      </div>
    </header>
    <fieldset class="palette-picker" id="palette-picker">
      <legend class="sr">Paleta</legend>
      <label><input type="radio" name="savia-palette" value="bosque" checked><span>Bosque</span></label>
      <label><input type="radio" name="savia-palette" value="tinta"><span>Tinta</span></label>
      <label><input type="radio" name="savia-palette" value="malva"><span>Malva</span></label>
    </fieldset>
    <p id="notice" class="notice" role="status" aria-atomic="true"></p>
    <main id="screen"></main>
  </div>
</div>
<dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
</body>
</html>
